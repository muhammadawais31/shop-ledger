name: al_madina_store
description: Al-Madina General Store Management System - POS, inventory, customer khata, PDF and Google Drive backup.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2          # state management
  sqflite: ^2.3.3           # local SQLite database
  path: ^1.9.0
  path_provider: ^2.1.3
  google_sign_in: ^6.2.1    # Google login (for Drive)
  googleapis: ^13.2.0       # official Google Drive API
  http: ^1.2.1
  pdf: ^3.11.0              # create PDF files
  printing: ^5.13.1         # share / print PDF
  url_launcher: ^6.3.0      # WhatsApp + phone call
  mobile_scanner: ^5.2.3    # barcode scanner (camera)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
